<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wispr HUD</title>
  <link rel="stylesheet" href="hud.css">
</head>
<body class="hud-body">
  <div id="hudPill" class="hud-pill state-hidden">
    <!-- Active Listening / Waveform Mode -->
    <div id="recordingView" class="hud-view active">
      <div class="waveform-wrap">
        <div class="wave-bar bar-1"></div>
        <div class="wave-bar bar-2"></div>
        <div class="wave-bar bar-3"></div>
        <div class="wave-bar bar-4"></div>
        <div class="wave-bar bar-5"></div>
        <div class="wave-bar bar-6"></div>
        <div class="wave-bar bar-7"></div>
      </div>
      <span class="hud-label">Listening</span>
    </div>

    <!-- Transcribing / Loading Mode -->
    <div id="transcribingView" class="hud-view">
      <div class="spinner-wrap">
        <div class="hud-spinner"></div>
      </div>
      <span class="hud-label">Transcribing</span>
    </div>

    <!-- Done / Inserted Mode -->
    <div id="doneView" class="hud-view">
      <svg class="done-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <span class="hud-label">Done</span>
    </div>
  </div>

  <script src="hud.js"></script>
</body>
</html>
